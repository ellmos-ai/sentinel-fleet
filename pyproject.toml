[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-fleet"
version = "1.0.0"
description = "Fortified Enterprise Agent Platform, Zero-Trust Governance & Autonomous Taskmaster on Gemini 3.5 and Google Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [
    { name = "SentinelFleet Team", email = "info@ellmos.ai" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-genai>=0.1.1",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "fpdf2>=2.7.8",
    # ASGI WebSocket support for /ws/run/{run_id} (the run console, concept doc section C.7).
    # FastAPI's own WebSocket route only works if the ASGI server has a WebSocket
    # implementation to hand it off to - uvicorn (the Dockerfile's actual server) needs this
    # installed explicitly, since it is declared here as plain "uvicorn", not "uvicorn[standard]".
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
# Optional: forwards the same OpenTelemetry spans to Google Cloud Trace (ENABLE_CLOUD_TRACE=true).
# Deliberately not a hard dependency, so the app runs unchanged outside GCP.
cloudtrace = [
    "opentelemetry-exporter-gcp-trace>=1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
