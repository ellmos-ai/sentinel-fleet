[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-fleet"
version = "1.0.0"
description = "Fortified Enterprise Agent Platform, Zero-Trust Governance & Autonomous Taskmaster on Gemini 3.5 and Google Cloud"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "SentinelFleet Team", email = "info@ellmos.ai" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "google-genai>=0.1.1",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
